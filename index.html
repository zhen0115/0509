<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手勢捕捉遊戲</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <style>
        /* 整體頁面樣式 */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 確保內容至少佔滿整個視窗高度 */
            margin: 0;
            background-color: #282c34; /* 深色背景 */
            font-family: 'Inter', sans-serif; /* 使用 Inter 字體 */
            color: white; /* 預設文字顏色為白色 */
            overflow: hidden; /* 防止滾動條出現 */
            padding: 20px; /* 增加一些內邊距 */
            box-sizing: border-box; /* 邊框盒模型 */
        }

        /* 遊戲容器樣式 */
        #game-container {
            border-radius: 15px; /* 圓角邊框 */
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); /* 發光邊框效果 */
            display: block; /* 移除 canvas 下方的額外空間 */
            width: 100%; /* 讓 canvas 寬度響應式 */
            max-width: 640px; /* 桌面端最大寬度 */
            height: auto; /* 維持長寬比 */
            background-color: #3a3f47; /* 較深的 canvas 背景 */
            margin-bottom: 20px; /* 與下方控制按鈕的間距 */
        }

        /* 控制按鈕容器樣式 */
        .controls {
            margin-top: 0; /* 調整與 canvas 的間距 */
            display: flex;
            gap: 15px; /* 按鈕之間的間距 */
            flex-wrap: wrap; /* 在小螢幕上換行 */
            justify-content: center; /* 水平居中按鈕 */
        }

        /* 按鈕樣式 */
        button {
            padding: 12px 25px;
            font-size: 1.2em;
            background-color: #007bff; /* 藍色背景 */
            color: white; /* 白色文字 */
            border: none; /* 無邊框 */
            border-radius: 10px; /* 圓角 */
            cursor: pointer; /* 鼠標懸停時顯示手型 */
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease; /* 平滑過渡效果 */
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.4); /* 陰影效果 */
            min-width: 150px; /* 最小寬度 */
        }

        /* 按鈕懸停效果 */
        button:hover {
            background-color: #0056b3; /* 深藍色 */
            transform: translateY(-2px); /* 輕微上移 */
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.6); /* 增強陰影 */
        }

        /* 按鈕點擊效果 */
        button:active {
            transform: translateY(0); /* 返回原位 */
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.3); /* 減弱陰影 */
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            #game-container {
                max-width: 95%; /* 小螢幕上佔用更多寬度 */
            }
            .controls {
                flex-direction: column; /* 按鈕垂直排列 */
                gap: 10px; /* 調整間距 */
            }
            button {
                width: 100%; /* 按鈕佔滿可用寬度 */
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        </div>
    <div class="controls">
        <button id="startButton">開始遊戲</button>
        <button id="resetButton" style="display: none;">再玩一次</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
