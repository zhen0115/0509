<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手勢控制接球遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars due to full-screen background */
        }
        /* Custom styles for the canvas container */
        #p5-canvas-container {
            border: 4px solid #6366f1; /* Indigo-500 */
            border-radius: 1rem; /* rounded-xl */
            overflow: hidden; /* Ensures content stays within rounded corners */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            display: flex; /* Use flexbox to center canvas */
            align-items: center;
            justify-content: center;
            background-color: rgba(17, 24, 39, 0.8); /* bg-gray-900 bg-opacity-80 */
        }
        canvas {
            display: block; /* Remove extra space below canvas */
        }
        /* Style for buttons */
        .game-button {
            padding: 0.75rem 1.5rem; /* px-6 py-3 */
            border-radius: 9999px; /* rounded-full */
            font-weight: 700; /* font-bold */
            font-size: 1.125rem; /* text-lg */
            transition: all 0.3s ease-in-out;
            background-color: #4f46e5; /* bg-indigo-600 */
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-lg */
        }
        .game-button:hover {
            background-color: #4338ca; /* hover:bg-indigo-700 */
            transform: scale(1.05); /* hover:scale-105 */
        }
        .game-button:active {
            transform: scale(0.95); /* active:scale-95 */
        }
        .game-button:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.5); /* focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 */
        }
        .game-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-800 to-indigo-900 text-white flex flex-col items-center justify-center p-4">

    <h1 class="text-5xl font-extrabold mb-8 text-center drop-shadow-lg">
        手勢控制接球遊戲
    </h1>

    <div class="flex flex-col md:flex-row items-center justify-center gap-8 w-full max-w-6xl">
        <div class="bg-gray-800 bg-opacity-70 p-6 rounded-xl shadow-2xl flex flex-col items-center w-full md:w-1/4 min-w-[200px]">
            <h2 class="text-3xl font-bold mb-4 text-purple-300">遊戲統計</h2>
            <div class="text-2xl mb-2">分數: <span id="score" class="font-semibold text-green-400">0</span></div>
            <div class="text-2xl mb-4">錯過: <span id="missedCircles" class="font-semibold text-red-400">0/5</span></div>
            <button id="startGameButton" class="game-button mt-4">
                載入模型中...
            </button>
            <p class="text-sm mt-4 text-gray-400 text-center">
                請確保您的攝影機已啟用並可見。
            </p>
        </div>

        <div id="p5-canvas-container" class="flex-grow flex items-center justify-center rounded-xl shadow-2xl">
            </div>
    </div>

    <div id="gameMessage" class="mt-8 text-3xl font-semibold text-center text-yellow-300 drop-shadow-md">
        按下開始按鈕開始！
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
